name: Free release checks
on: [push, pull_request]

jobs:
  authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: specforge
          POSTGRES_PASSWORD: specforge
          POSTGRES_DB: specforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U specforge -d specforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://specforge:specforge@localhost:5432/specforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/db run migrate
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/specforge run build
        env:
          NODE_ENV: production
          PORT: '8080'
          BASE_PATH: /
      - run: node --test scripts/api-authorization.test.mjs
